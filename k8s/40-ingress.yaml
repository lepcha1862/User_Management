apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: usermgmt-ingress
  namespace: usermgmt-02230125
  labels:
    app: api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: usermgmt-02230125.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80

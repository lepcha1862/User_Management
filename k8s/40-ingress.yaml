apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: usermgmt-ingress
  namespace: usermgmt-02230125
  labels:
    app: usermgmt                       # was: api — this Ingress now serves two tiers
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: usermgmt-02230125.local
      http:
        paths:
          # ─── Backend (Flask) ─────────────────────────────
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          # ─── Frontend (nginx static) ─────────────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80